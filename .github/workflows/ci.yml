name: CI Pipeline

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10 

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:unit

  build-docker:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend
        run: docker build -t backend:test -f apps/backend/Dockerfile .

      - name: Build Frontend
        run: docker build -t frontend:test -f apps/frontend/Dockerfile .

      - name: Build Worker
        run: docker build -t worker:test -f apps/worker/Dockerfile .

  notify:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [test, build-docker]
    if: success()
    
    steps:
      - name: Success Message
        run: |
          echo "✅ All checks passed!"
          echo "🚀 Staging will auto-deploy"
