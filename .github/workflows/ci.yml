name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.17.1'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:unit
        env:
          NODE_ENV: test
          ADMIN_JWT_SECRET: test-jwt-secret
          ADMIN_JWT_REFRESH_SECRET: test-refresh-secret

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: theblogproj-test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run Prisma migrations
        run: pnpm db:migrate:test
        env:
          NODE_ENV: test
          POSTGRES_DATABASE_URL: postgresql://postgres:test-password@localhost:5432/theblogproj-test?schema=public

      - run: pnpm test
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017
          DB_NAME: theblogproj-test
          POSTGRES_DATABASE_URL: postgresql://postgres:test-password@localhost:5432/theblogproj-test?schema=public
          REDIS_URL: redis://localhost:6379
          ENABLE_MONGO: true
          ENABLE_PRISMA: true
          ENABLE_REDIS: true
          ENABLE_CACHE: false
          ADMIN_JWT_SECRET: test-jwt-secret
          ADMIN_JWT_REFRESH_SECRET: test-refresh-secret
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
