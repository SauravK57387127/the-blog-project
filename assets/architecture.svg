<svg width="100%" viewBox="0 0 680 455" role="img" xmlns="http://www.w3.org/2000/svg">
<title>InnerFlame system architecture</title>
<desc>Four-tier architecture: browser, Vercel Next.js frontend, Render Express backend, Render BullMQ worker, MongoDB Atlas, PostgreSQL, Redis Upstash, and external services Clerk, Cloudinary, Sentry, GitHub Actions.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.t { font-family: sans-serif; font-size: 14px; font-weight: 400; fill: #3d3d3a; }
.th { font-family: sans-serif; font-size: 14px; font-weight: 500; fill: #3d3d3a; }
.ts { font-family: sans-serif; font-size: 12px; font-weight: 400; fill: #73726c; }
.arr { stroke: #888; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
.c-gray rect, .c-gray circle { fill: #F1EFE8; stroke: #5F5E5A; }
.c-gray text.th { fill: #444441; }
.c-gray text.ts { fill: #5F5E5A; }
.c-purple rect, .c-purple circle { fill: #EEEDFE; stroke: #534AB7; }
.c-purple text.th { fill: #3C3489; }
.c-purple text.ts { fill: #534AB7; }
.c-teal rect, .c-teal circle { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal text.th { fill: #085041; }
.c-teal text.ts { fill: #0F6E56; }
.c-amber rect, .c-amber circle { fill: #FAEEDA; stroke: #854F0B; }
.c-amber text.th { fill: #633806; }
.c-amber text.ts { fill: #854F0B; }
.c-coral rect, .c-coral circle { fill: #FAECE7; stroke: #993C1D; }
.c-coral text.th { fill: #712B13; }
.c-coral text.ts { fill: #993C1D; }
</style>
</defs>

<!-- Browser -->
<g class="c-gray">
<rect x="250" y="30" width="180" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="44" text-anchor="middle" dominant-baseline="central">Browser</text>
<text class="ts" x="340" y="60" text-anchor="middle" dominant-baseline="central">visits InnerFlame</text>
</g>

<!-- App layer -->
<g class="c-purple">
<rect x="40" y="110" width="175" height="54" rx="8" stroke-width="0.5"/>
<text class="th" x="127" y="128" text-anchor="middle" dominant-baseline="central">Vercel</text>
<text class="ts" x="127" y="146" text-anchor="middle" dominant-baseline="central">Next.js 16 · ISR · RSC</text>
</g>
<g class="c-teal">
<rect x="253" y="110" width="175" height="54" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="128" text-anchor="middle" dominant-baseline="central">Render backend</text>
<text class="ts" x="340" y="146" text-anchor="middle" dominant-baseline="central">Express 5 · REST API</text>
</g>
<g class="c-teal">
<rect x="466" y="110" width="175" height="54" rx="8" stroke-width="0.5"/>
<text class="th" x="553" y="128" text-anchor="middle" dominant-baseline="central">Render worker</text>
<text class="ts" x="553" y="146" text-anchor="middle" dominant-baseline="central">BullMQ · scheduling</text>
</g>

<!-- Data layer -->
<g class="c-amber">
<rect x="40" y="225" width="165" height="54" rx="8" stroke-width="0.5"/>
<text class="th" x="122" y="243" text-anchor="middle" dominant-baseline="central">MongoDB Atlas</text>
<text class="ts" x="122" y="261" text-anchor="middle" dominant-baseline="central">blogs · comments</text>
</g>
<g class="c-amber">
<rect x="258" y="225" width="165" height="54" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="243" text-anchor="middle" dominant-baseline="central">PostgreSQL</text>
<text class="ts" x="340" y="261" text-anchor="middle" dominant-baseline="central">admin · events</text>
</g>
<g class="c-amber">
<rect x="476" y="225" width="165" height="54" rx="8" stroke-width="0.5"/>
<text class="th" x="558" y="243" text-anchor="middle" dominant-baseline="central">Redis · Upstash</text>
<text class="ts" x="558" y="261" text-anchor="middle" dominant-baseline="central">rate limit · cache</text>
</g>

<!-- External services -->
<g class="c-coral">
<rect x="40" y="335" width="130" height="54" rx="8" stroke-width="0.5"/>
<text class="th" x="105" y="353" text-anchor="middle" dominant-baseline="central">Clerk</text>
<text class="ts" x="105" y="371" text-anchor="middle" dominant-baseline="central">user auth</text>
</g>
<g class="c-coral">
<rect x="183" y="335" width="130" height="54" rx="8" stroke-width="0.5"/>
<text class="th" x="248" y="353" text-anchor="middle" dominant-baseline="central">Cloudinary</text>
<text class="ts" x="248" y="371" text-anchor="middle" dominant-baseline="central">image CDN</text>
</g>
<g class="c-coral">
<rect x="326" y="335" width="130" height="54" rx="8" stroke-width="0.5"/>
<text class="th" x="391" y="353" text-anchor="middle" dominant-baseline="central">Sentry</text>
<text class="ts" x="391" y="371" text-anchor="middle" dominant-baseline="central">error tracking</text>
</g>
<g class="c-gray">
<rect x="469" y="335" width="172" height="54" rx="8" stroke-width="0.5"/>
<text class="th" x="555" y="353" text-anchor="middle" dominant-baseline="central">GitHub Actions</text>
<text class="ts" x="555" y="371" text-anchor="middle" dominant-baseline="central">CI/CD pipeline</text>
</g>

<!-- Arrows -->
<path class="arr" d="M310,74 L310,92 L127,92 L127,107"/>
<line class="arr" x1="215" y1="137" x2="251" y2="137"/>
<text class="ts" x="233" y="128" text-anchor="middle" fill="#73726c">REST</text>
<line class="arr" x1="428" y1="137" x2="464" y2="137"/>
<text class="ts" x="446" y="128" text-anchor="middle" fill="#73726c">queue</text>
<path class="arr" d="M285,164 L285,195 L122,195 L122,222"/>
<line class="arr" x1="340" y1="164" x2="340" y2="222"/>
<path class="arr" d="M395,164 L395,210 L500,210 L500,222"/>
<line class="arr" x1="553" y1="164" x2="558" y2="222"/>

<!-- Legend -->
<circle class="c-purple" cx="45" cy="422" r="5" stroke-width="0.5"/>
<text class="ts" x="57" y="426" fill="#73726c">Frontend</text>
<circle class="c-teal" cx="132" cy="422" r="5" stroke-width="0.5"/>
<text class="ts" x="144" y="426" fill="#73726c">Backend · Worker</text>
<circle class="c-amber" cx="278" cy="422" r="5" stroke-width="0.5"/>
<text class="ts" x="290" y="426" fill="#73726c">Data stores</text>
<circle class="c-coral" cx="375" cy="422" r="5" stroke-width="0.5"/>
<text class="ts" x="387" y="426" fill="#73726c">External services</text>
</svg>
