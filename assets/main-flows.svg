<svg width="100%" viewBox="0 0 680 470" role="img" xmlns="http://www.w3.org/2000/svg">
<title>InnerFlame main flows</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.th { font-family: sans-serif; font-size: 14px; font-weight: 500; fill: #3d3d3a; }
.ts { font-family: sans-serif; font-size: 12px; font-weight: 400; fill: #73726c; }
.arr { stroke: #888; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
.c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; } .c-gray .th { fill: #444441; } .c-gray .ts { fill: #5F5E5A; }
.c-purple rect { fill: #EEEDFE; stroke: #534AB7; } .c-purple .th { fill: #3C3489; } .c-purple .ts { fill: #534AB7; }
.c-teal rect { fill: #E1F5EE; stroke: #0F6E56; } .c-teal .th { fill: #085041; } .c-teal .ts { fill: #0F6E56; }
.c-amber rect { fill: #FAEEDA; stroke: #854F0B; } .c-amber .th { fill: #633806; } .c-amber .ts { fill: #854F0B; }
</style>
</defs>
<text class="ts" x="160" y="22" text-anchor="middle">— reader journey</text>
<text class="ts" x="520" y="22" text-anchor="middle">— admin journey</text>
<line x1="330" y1="12" x2="330" y2="448" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4 4"/>
<g class="c-gray"><rect x="40" y="40" width="240" height="54" rx="8" stroke-width="0.5"/><text class="th" x="160" y="58" text-anchor="middle" dominant-baseline="central">Visit blog URL</text><text class="ts" x="160" y="76" text-anchor="middle" dominant-baseline="central">user browses to page</text></g>
<g class="c-purple"><rect x="40" y="124" width="240" height="54" rx="8" stroke-width="0.5"/><text class="th" x="160" y="142" text-anchor="middle" dominant-baseline="central">Vercel serves page</text><text class="ts" x="160" y="160" text-anchor="middle" dominant-baseline="central">ISR cache · Next.js 16</text></g>
<g class="c-teal"><rect x="40" y="208" width="240" height="54" rx="8" stroke-width="0.5"/><text class="th" x="160" y="226" text-anchor="middle" dominant-baseline="central">Backend API call</text><text class="ts" x="160" y="244" text-anchor="middle" dominant-baseline="central">fetch blog · comments</text></g>
<g class="c-amber"><rect x="40" y="292" width="240" height="54" rx="8" stroke-width="0.5"/><text class="th" x="160" y="310" text-anchor="middle" dominant-baseline="central">MongoDB query</text><text class="ts" x="160" y="328" text-anchor="middle" dominant-baseline="central">blogs · analytics</text></g>
<g class="c-teal"><rect x="40" y="376" width="240" height="54" rx="8" stroke-width="0.5"/><text class="th" x="160" y="394" text-anchor="middle" dominant-baseline="central">View tracked</text><text class="ts" x="160" y="412" text-anchor="middle" dominant-baseline="central">session · scroll · time spent</text></g>
<line class="arr" x1="160" y1="94" x2="160" y2="122"/><line class="arr" x1="160" y1="178" x2="160" y2="206"/><line class="arr" x1="160" y1="262" x2="160" y2="290"/><line class="arr" x1="160" y1="346" x2="160" y2="374"/>
<g class="c-gray"><rect x="400" y="40" width="240" height="54" rx="8" stroke-width="0.5"/><text class="th" x="520" y="58" text-anchor="middle" dominant-baseline="central">Admin logs in</text><text class="ts" x="520" y="76" text-anchor="middle" dominant-baseline="central">JWT access token issued</text></g>
<g class="c-purple"><rect x="400" y="124" width="240" height="54" rx="8" stroke-width="0.5"/><text class="th" x="520" y="142" text-anchor="middle" dominant-baseline="central">Create draft</text><text class="ts" x="520" y="160" text-anchor="middle" dominant-baseline="central">Tiptap · Cloudinary images</text></g>
<g class="c-teal"><rect x="400" y="208" width="240" height="54" rx="8" stroke-width="0.5"/><text class="th" x="520" y="226" text-anchor="middle" dominant-baseline="central">Schedule or publish</text><text class="ts" x="520" y="244" text-anchor="middle" dominant-baseline="central">set publishedAt date</text></g>
<g class="c-amber"><rect x="400" y="292" width="240" height="54" rx="8" stroke-width="0.5"/><text class="th" x="520" y="310" text-anchor="middle" dominant-baseline="central">BullMQ job queued</text><text class="ts" x="520" y="328" text-anchor="middle" dominant-baseline="central">Redis stores job · jitter delay</text></g>
<g class="c-teal"><rect x="400" y="376" width="240" height="54" rx="8" stroke-width="0.5"/><text class="th" x="520" y="394" text-anchor="middle" dominant-baseline="central">Worker publishes</text><text class="ts" x="520" y="412" text-anchor="middle" dominant-baseline="central">status → published · MongoDB</text></g>
<line class="arr" x1="520" y1="94" x2="520" y2="122"/><line class="arr" x1="520" y1="178" x2="520" y2="206"/><line class="arr" x1="520" y1="262" x2="520" y2="290"/><line class="arr" x1="520" y1="346" x2="520" y2="374"/>
</svg>
