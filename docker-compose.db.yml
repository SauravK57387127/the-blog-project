version: '3.8'

services:
    mongodb:
        image: mongo:7
        container_name: theblogproj-mongo-dev
        ports:
            - '27017:27017'
        environment:
            MONGO_INITDB_DATABASE: theblogproj-dev
        volumes:
            - mongodb_data:/data/db
        restart: unless-stopped
        healthcheck:
            test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/theblogproj-dev --quiet
            interval: 10s
            timeout: 5s
            retries: 5

    postgres:
        image: postgres:16-alpine
        container_name: theblogproj-postgres-dev
        ports:
            - '5432:5432'
        environment:
            POSTGRES_DB: theblogproj-dev
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: dev-password
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        container_name: theblogproj-redis-dev
        ports:
            - '6379:6379'
        volumes:
            - redis_data:/data
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    mongodb_data:
    postgres_data:
    redis_data:
